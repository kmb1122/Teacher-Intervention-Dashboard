name: CI/CD Pipeline

# 1. Trigger the pipeline on pushes or pull requests to the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 2. Continuous Integration (CI) Job: Build and Test
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  # 3. Continuous Deployment (CD) Job: Deploy (Only runs if testing passes)
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Hosting Provider
        run: echo "Insert your cloud deployment command here (e.g., AWS, Vercel, Docker)"
